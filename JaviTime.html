<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#131826">
<title>JaviTime</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="JaviTime">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
:root{
  --bg:#131826;--s1:#1A2032;--s2:#222A40;--s3:#2A334C;--line:#2D3550;
  --tx:#ECE8DF;--mu:#8D96AC;--dim:#5E6782;
  --amber:#F2B544;--ok:#7BC59A;--bad:#EF6F6C;
  --disp:"Bricolage Grotesque",Figtree,system-ui,sans-serif;
  color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx)}
body{font:15px/1.45 Figtree,system-ui,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px;border-radius:6px}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 130px}

/* header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding:14px 0 10px;display:flex;align-items:center;gap:10px}
.htitle{flex:1;min-width:0}
.htitle h1{margin:0;font:800 26px/1.05 var(--disp);letter-spacing:-.01em}
.htitle .sub{color:var(--mu);font-size:13px}
.iconbtn{width:38px;height:38px;border-radius:12px;background:var(--s1);display:grid;place-items:center;color:var(--mu);font-size:17px}
.iconbtn:active{background:var(--s2)}
.todaypill{font-size:12px;font-weight:600;padding:6px 10px;border-radius:99px;background:var(--amber);color:#1a1405}
.sync{width:8px;height:8px;border-radius:50%;background:var(--dim);flex:none}
.sync.on{background:var(--ok)}.sync.pend{background:var(--amber)}.sync.off{background:var(--bad)}

/* hero */
.hero{margin:6px 0 18px;padding:18px 18px 16px;border-radius:20px;background:var(--s1);position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--hc,var(--amber))}
.hero .hk{font-size:13px;color:var(--mu)}
.hero .hbig{font:800 54px/1 var(--disp);color:var(--amber);letter-spacing:-.02em;margin:4px 0 6px}
.hero .hbig small{font-size:20px;font-weight:700;margin-left:6px;color:var(--amber)}
.hero .hname{font-weight:600;font-size:17px}
.hbar{height:6px;border-radius:9px;background:var(--s3);margin:12px 0 10px;overflow:hidden}
.hbar i{display:block;height:100%;background:var(--amber);border-radius:9px}
.hero .hnext{color:var(--mu);font-size:13px}
.hero ul{margin:10px 0 0}

/* sections */
.sec{margin:22px 0 10px;display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.sec h2{margin:0;font:700 19px/1.2 var(--disp)}
.sec .side{color:var(--mu);font-size:13px}
.link{color:var(--amber);font-weight:600;font-size:14px}
.muted{color:var(--mu)}
.focus{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:14px;border:1px solid var(--line);font-size:14px}
.focus b{font-weight:600}
.focus .pbar{flex:0 0 70px}

/* las 3 */
.top3{display:grid;gap:8px}
.slot{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:var(--s1);min-height:56px}
.slot .n{font:800 26px/1 var(--disp);color:var(--amber);width:22px;text-align:center}
.slot.empty{background:transparent;border:1.5px dashed var(--line);color:var(--mu);width:100%;text-align:left}
.slot.empty .n{color:var(--dim)}
.slot .t{flex:1;min-width:0;font-weight:600}
.slot.done .t{text-decoration:line-through;color:var(--mu)}
.slot .em{font-size:14px;color:var(--mu)}

/* checks & task rows */
ul.tl{list-style:none;margin:0;padding:0}
ul.tl li{display:flex;align-items:center;gap:10px;padding:6px 0;min-height:34px}
ul.tl li .tx{flex:1;min-width:0;overflow-wrap:anywhere}
ul.tl li.done .tx{text-decoration:line-through;color:var(--mu)}
.ck{flex:none;width:22px;height:22px;border-radius:7px;border:2px solid var(--dim);display:grid;place-items:center;transition:background .15s,border-color .15s}
.ck.on{background:var(--ok);border-color:var(--ok)}
.ck.on::after{content:"";width:6px;height:11px;border:solid #12301f;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.mini{font-size:12px;color:var(--mu);padding:4px 9px;border-radius:99px;background:var(--s2);flex:none}
.mini.amb{background:var(--amber);color:#1a1405;font-weight:600}
.x{flex:none;width:28px;height:28px;border-radius:9px;color:var(--dim);font-size:16px}
.x:active{background:var(--s2)}
.ib{flex:none;width:32px;height:32px;border-radius:9px;display:grid;place-items:center;font-size:15px;color:var(--mu);background:var(--s2)}
.ib:active{background:var(--s3)}

/* agenda */
.agenda{display:grid;gap:8px}
.box{display:grid;grid-template-columns:52px 1fr;gap:10px}
.rail{text-align:right;padding-top:12px}
.rail b{display:block;font:700 15px/1 var(--disp)}
.rail span{display:block;font-size:12px;color:var(--dim);margin-top:4px}
.bx{background:var(--s1);border-radius:16px;padding:10px 14px 8px;border-left:4px solid var(--c);min-height:var(--h,56px)}
.box.now .bx{background:var(--s2);box-shadow:0 0 0 1.5px var(--amber) inset}
.box.done .bx{opacity:.55}
.bxhead{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:2px 0 4px}
.bxhead .bt{font-weight:700;flex:1;min-width:0}
.bxhead .bd{font-size:12px;color:var(--mu)}
.addt{font-size:13px;color:var(--mu);padding:4px 0}
.gap{display:grid;grid-template-columns:52px 1fr;gap:10px}
.gap .g{border:1.5px dashed var(--line);border-radius:14px;padding:10px 14px;color:var(--mu);font-size:14px;text-align:left;width:100%;display:flex;justify-content:space-between;align-items:center;gap:8px}
.gap .g:active{background:var(--s1)}
.gap .g .plus{color:var(--amber);font-weight:700}
.nowline{display:grid;grid-template-columns:52px 1fr;gap:10px;align-items:center}
.nowline b{text-align:right;color:var(--amber);font:700 13px var(--disp)}
.nowline i{height:2px;background:var(--amber);border-radius:2px;position:relative}
.nowline i::before{content:"";position:absolute;left:-4px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--amber)}

/* cards & forms */
.card{background:var(--s1);border-radius:18px;padding:14px}
.row{display:flex;gap:8px;align-items:center}
.row>*{min-width:0}
.grow{flex:1}
input[type=text],input[type=number],input[type=date],input[type=time],input:not([type]),select,textarea{width:100%;background:var(--s2);border:1px solid transparent;border-radius:12px;padding:11px 12px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--amber)}
select{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mu) 50%),linear-gradient(135deg,var(--mu) 50%,transparent 50%);background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:28px}
.btn{padding:11px 16px;border-radius:12px;background:var(--s2);font-weight:600;white-space:nowrap}
.btn.primary{background:var(--amber);color:#1a1405}
.btn.danger{color:var(--bad)}
.btn.block{width:100%}
.btn:active{filter:brightness(1.1)}
.stack{display:grid;gap:8px}
.lbl{font-size:13px;color:var(--mu);margin:14px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:8px 12px;border-radius:99px;background:var(--s2);font-size:14px;color:var(--mu);border:1.5px solid transparent}
.chip.on{color:var(--tx);border-color:var(--cc,var(--amber));background:var(--s3)}
.scroller{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.scroller::-webkit-scrollbar{display:none}
.scroller .chip{flex:none}
.tog{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:14px}
.tog input{width:20px;height:20px;accent-color:var(--amber)}

/* banco */
.grp{margin-top:16px}
.grph{display:flex;align-items:center;gap:8px;margin-bottom:4px;font-weight:700}
.grph .dot{width:10px;height:10px;border-radius:3px;background:var(--c)}
.grph .cnt{color:var(--mu);font-weight:500;font-size:13px}
.lvl{flex:none;width:8px;height:8px;border-radius:50%}
.titem{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.titem:last-child{border-bottom:0}
.titem .body{flex:1;min-width:0;text-align:left}
.titem .body .tx{display:block;overflow-wrap:anywhere}
.titem .meta{display:flex;gap:4px 10px;flex-wrap:wrap;margin-top:3px;font-size:12px;color:var(--mu)}
.titem .meta .miss{color:var(--bad)}
.tagp{color:var(--tc);border:1px solid var(--tc);border-radius:99px;padding:0 7px;font-size:11px;line-height:17px;white-space:nowrap}
.tagrow{display:inline-flex;gap:4px;flex-wrap:wrap;margin-left:6px;vertical-align:middle}
.hoybtn{flex:none;font-size:13px;font-weight:600;color:var(--amber);padding:6px 10px;border-radius:10px;background:var(--s2)}

/* score */
.score{display:grid;gap:10px}
.srow{display:flex;align-items:center;gap:10px}
.srow .sl{width:96px;font-weight:600;font-size:13px;line-height:1.2}
.dots{display:flex;gap:6px;flex:1}
.sd{flex:1;height:30px;border-radius:9px;background:var(--s2);font:700 13px var(--disp);color:var(--dim)}
.sd.on{background:var(--sc);color:#141824}

/* gastos */
.seg{display:flex;background:var(--s1);border-radius:12px;padding:3px}
.seg button{flex:1;padding:8px;border-radius:9px;font-weight:600;font-size:14px;color:var(--mu)}
.seg button.on{background:var(--s3);color:var(--tx)}
.pnav{display:flex;align-items:center;justify-content:space-between;margin:12px 0}
.pnav b{font:700 17px var(--disp)}
.total{font:800 40px/1 var(--disp);letter-spacing:-.02em}
.pbar{height:8px;border-radius:9px;background:var(--s3);overflow:hidden}
.pbar i{display:block;height:100%;border-radius:9px;background:var(--ok)}
.pbar i.warn{background:var(--amber)}.pbar i.over{background:var(--bad)}
.chart{display:flex;align-items:flex-end;gap:3px;height:120px;margin-top:14px}
.chart .c{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;min-width:0}
.chart .c i{display:block;width:100%;border-radius:4px 4px 2px 2px;background:var(--s3);min-height:2px}
.chart .c i.has{background:var(--mu)}
.chart .c.today i{background:var(--amber)}
.chart .c span{font-size:10px;color:var(--dim);height:12px}
.catrow{padding:10px 0;border-bottom:1px solid var(--line)}
.catrow:last-child{border-bottom:0}
.catrow .top{display:flex;justify-content:space-between;gap:8px;margin-bottom:6px;font-size:14px}
.catrow .top b{font-weight:600}
.exp{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.exp:last-child{border-bottom:0}
.exp .em{font-size:18px;width:26px;text-align:center}
.exp .d{flex:1;min-width:0}
.exp .d small{display:block;color:var(--mu);font-size:12px}
.exp .m{font-weight:700;font-family:var(--disp)}

/* metas */
.goal{padding:12px 0;border-bottom:1px solid var(--line)}
.goal:last-child{border-bottom:0}
.goal .gt{display:flex;align-items:flex-start;gap:8px}
.goal .gt .tx{flex:1;font-weight:600;text-align:left}
.goal .gm{display:flex;align-items:center;gap:10px;margin-top:8px;font-size:12px;color:var(--mu)}
.goal input[type=range]{flex:1;accent-color:var(--amber)}
.star{font-size:18px;color:var(--dim)}
.star.on{color:var(--amber)}
.schart{display:flex;align-items:flex-end;gap:4px;height:100px;margin-top:12px}
.schart .c{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;gap:1px;align-items:stretch}
.schart .c i{display:block;border-radius:2px}
.schart .c span{font-size:10px;color:var(--dim);text-align:center;margin-top:3px}
.legend{display:flex;gap:12px;font-size:12px;color:var(--mu);margin-top:8px}
.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px}
.bars{display:flex;align-items:flex-end;gap:3px;height:var(--h,120px);margin-top:12px}
.bars .c{flex:1;display:flex;flex-direction:column;height:100%;min-width:0}
.bars .st{flex:1;display:flex;flex-direction:column-reverse;justify-content:flex-start;border-bottom:2px solid var(--s3);border-radius:4px 4px 0 0;overflow:hidden}
.bars .st i{display:block;width:100%;flex:none}
.bars .c span{font-size:10px;color:var(--dim);text-align:center;height:13px;margin-top:4px;white-space:nowrap}
.bars .c.td span{color:var(--amber);font-weight:700}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kpi{background:var(--s1);border-radius:16px;padding:12px 14px}
.kpi b{display:block;font:800 26px/1.1 var(--disp)}
.kpi span{font-size:12px;color:var(--mu);display:block}
.kpi .dl{font-size:12px;font-weight:700;margin-top:4px}
.dl.up{color:var(--ok)}.dl.dn{color:var(--bad)}.dl.eq{color:var(--mu)}
.todayg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.todayg div{background:var(--s2);border-radius:12px;padding:10px;text-align:center}
.todayg b{display:block;font:800 22px/1.1 var(--disp)}
.todayg span{font-size:11px;color:var(--mu)}
.insight{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.insight:last-child{border-bottom:0}
.hbarrow{display:grid;grid-template-columns:110px 1fr 34px;gap:8px;align-items:center;font-size:13px;padding:5px 0}
.hbarrow .pbar{height:10px}
.sbadge{flex:none;font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;border:1.5px solid var(--ok);color:var(--ok);background:transparent}
.sbadge.open{background:var(--ok);color:#12301f}
li.subs{display:block;padding:0 0 6px 32px;min-height:0}
.subrow{display:flex;align-items:center;gap:10px;padding:5px 0;font-size:14px}
.subrow .ck{width:19px;height:19px;border-radius:6px}
.subrow.done span{text-decoration:line-through;color:var(--mu)}
.notegrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.note{background:var(--s1);border-radius:16px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:110px;border-top:3px solid var(--nc,var(--s3))}
.note b{font-weight:700;font-size:15px;overflow-wrap:anywhere}
.note p{margin:0;font-size:13px;color:var(--mu);display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line}
.note small{margin-top:auto;font-size:11px;color:var(--dim)}
.fold{background:var(--s1);border-radius:16px;padding:12px 14px;margin-bottom:8px}
.fold .fh{display:flex;align-items:center;gap:10px;width:100%;text-align:left}
.fold .fh b{flex:1;font-size:16px}
.calg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px}
.calg .dh{text-align:center;font-size:12px;color:var(--mu);padding:4px 0}
.calg button{aspect-ratio:1;border-radius:12px;background:var(--s2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:700 15px var(--disp);position:relative}
.calg button.out{visibility:hidden}
.calg button.td{box-shadow:0 0 0 2px var(--amber) inset}
.calg button.sel{background:var(--amber);color:#1a1405}
.calg button.past{color:var(--mu)}
.calg .cnt{font:700 10px Figtree,sans-serif;color:var(--amber)}
.calg button.sel .cnt{color:#1a1405}
.calg .dots{display:flex;gap:2px;height:5px}
.calg .dots i{width:5px;height:5px;border-radius:50%}
textarea{width:100%;background:var(--s2);border:1px solid transparent;border-radius:12px;padding:11px 12px;outline:none;resize:vertical;min-height:180px;line-height:1.5}
.quote{margin:0 0 18px;padding:16px 18px;border-radius:18px;background:linear-gradient(135deg,var(--s1),var(--s2));position:relative}
.quote q{display:block;font:600 17px/1.4 var(--disp);quotes:"“" "”"}
.quote .qa{display:flex;justify-content:space-between;align-items:center;margin-top:8px;color:var(--amber);font-size:13px;font-weight:600}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:var(--s1);border-radius:16px;padding:12px 14px}
.stat b{display:block;font:800 28px/1.1 var(--disp)}
.stat span{font-size:13px;color:var(--mu)}

/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(19,24,38,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{max-width:560px;margin:0 auto;display:flex}
nav.tabs button{flex:1;min-width:0;padding:10px 0 9px;display:grid;justify-items:center;gap:2px;font-size:11px;color:var(--dim);font-weight:600}
nav.tabs button .i{font-size:19px;filter:grayscale(1);opacity:.6}
nav.tabs button.on{color:var(--tx)}
nav.tabs button.on .i{filter:none;opacity:1}
.badge{display:inline-block;min-width:16px;padding:0 4px;border-radius:9px;background:var(--bad);color:#fff;font-size:10px;line-height:16px;margin-left:3px}

/* sheet */
#sheet{position:fixed;inset:0;z-index:50;display:none}
#sheet.open{display:block}
.sh-back{position:absolute;inset:0;background:rgba(5,8,16,.6)}
.sh{position:absolute;left:0;right:0;bottom:0;max-height:88vh;overflow:auto;background:var(--s1);border-radius:22px 22px 0 0;padding:8px 18px calc(18px + env(safe-area-inset-bottom,0px));max-width:560px;margin:0 auto}
.sh.anim{animation:up .2s ease-out}
.sh::before{content:"";display:block;width:40px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 12px}
.sh h3{margin:0 0 4px;font:700 21px var(--disp)}
.shback{display:inline-flex;align-items:center;gap:4px;color:var(--mu);font-weight:600;font-size:14px;padding:6px 10px 6px 4px;margin:-4px 0 6px -4px;border-radius:10px}
.shback:active{background:var(--s2)}
.shfoot{display:flex;gap:8px;margin-top:20px;position:sticky;bottom:-18px;background:var(--s1);padding:10px 0 4px}
.shfoot .primary{flex:1}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
.srow2{display:grid;grid-template-columns:44px 1fr 92px 32px;gap:6px;align-items:center;margin-bottom:6px}
.srow2 input{padding:9px 8px}
.daytog{display:flex;gap:4px}
.daytog button{width:30px;height:30px;border-radius:8px;background:var(--s2);font-size:12px;color:var(--mu)}
.daytog button.on{background:var(--amber);color:#1a1405;font-weight:700}
.fixrow{background:var(--s2);border-radius:14px;padding:10px;margin-bottom:8px;display:grid;gap:8px}
.fixrow select,.fixrow input{background:var(--s3)}

/* alarm overlay */
#pomo{position:fixed;inset:0;z-index:70;background:var(--bg);display:none;padding:calc(20px + env(safe-area-inset-top,0px)) 20px calc(24px + env(safe-area-inset-bottom,0px))}
#pomo.open{display:flex}
#pomo .pin{max-width:460px;margin:0 auto;width:100%;display:flex;flex-direction:column;align-items:center;text-align:center}
.ptop{width:100%;display:flex;justify-content:space-between;align-items:center}
.pphase{margin-top:8vh;font:700 18px var(--disp);color:var(--pc)}

<script>
/* ---------- utilidades ---------- */
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,10);
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return ymd(d)};
const today=()=>ymd(new Date());
const nowMin=()=>{const d=new Date();return d.getHours()*60+d.getMinutes()};
const hm=m=>pad(Math.floor(m/60)%24)+':'+pad(m%60);
const dow=s=>((parse(s).getDay()+6)%7)+1; // 1=lunes
const mondayOf=s=>addDays(s,1-dow(s));
const dim=s=>{const d=parse(s);return new Date(d.getFullYear(),d.getMonth()+1,0).getDate()};
const money=n=>'$'+Math.round(n||0).toLocaleString('es-AR');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDur=m=>{const h=Math.floor(m/60),r=m%60;return h?(h+' h'+(r?' '+r:'')):(r+' min')};
const DIAS=['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
const DIAS_L=['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];

const DAY_START=540, DAY_END=1440;

/* ---------- valores por defecto ---------- */
const DEF_BLOCKS=[
 {id:'pc',name:'PC',emoji:'💻',color:'#5AB0E8'},
 {id:'dep',name:'Depósito',emoji:'📦',color:'#7BC59A'},
 {id:'calle',name:'Calle y trámites',emoji:'🚗',color:'#E58BA0'},
 {id:'celu',name:'Celu y llamadas',emoji:'📱',color:'#B79CF0'},
 {id:'redes',name:'Redes',emoji:'📸',color:'#62CFCB'},
 {id:'personal',name:'Personal',emoji:'🏠',color:'#B9B2A3'},
 {id:'gym',name:'Entreno',emoji:'💪',color:'#FF8A65'},
 {id:'estudio',name:'Estudio',emoji:'📚',color:'#D9C36A'},
 {id:'fisico',name:'Tareas físicas',emoji:'🏋️',color:'#8FD16A'}];
const DEF_FIXED=[
 {id:'f1',blockId:'gym',title:'Entreno',days:[1,3,5],start:960,dur:90},
 {id:'f2',blockId:'gym',title:'Entreno',days:[2,4],start:1200,dur:90}];
const DEF_ECATS=[
 {id:'comida',name:'Comida',emoji:'🍔',budget:0},{id:'super',name:'Súper',emoji:'🛒',budget:0},
 {id:'auto',name:'Auto y nafta',emoji:'⛽',budget:0},{id:'salidas',name:'Salidas',emoji:'🍻',budget:0},
 {id:'serv',name:'Servicios',emoji:'💡',budget:0},{id:'salud',name:'Salud',emoji:'💊',budget:0},
 {id:'ropa',name:'Ropa',emoji:'👕',budget:0},{id:'gym',name:'Gym',emoji:'🏋️',budget:0},
 {id:'otros',name:'Otros',emoji:'📌',budget:0}];
const DEF_TAGS=[{id:'rapida',name:'Rápida',color:'#7BC59A'},{id:'esperando',name:'Esperando a alguien',color:'#B79CF0'},{id:'plata',name:'Plata',color:'#F0A04B'},{id:'casa',name:'Casa',color:'#B9B2A3'}];
const PALETTE=['#5AB0E8','#7BC59A','#E58BA0','#B79CF0','#62CFCB','#F0A04B','#FF8A65','#9AA7C7','#D9C36A','#8FD16A'];
const pickColor=n=>PALETTE[n%PALETTE.length];
const LEVELS={u:{name:'Urgente, hacer ya',short:'Urgente',c:'#EF6F6C',o:0},a:{name:'Importante',short:'Importante',c:'#F0A04B',o:1},n:{name:'Normal',short:'Normal',c:'#8D96AC',o:2},s:{name:'Algún día',short:'Algún día',c:'#6C7CA8',o:3}};
const TIPOS={dia:'Por día',sem:'Semanal',mes:'Mensual'};
const AREAS={j:{name:'Negocio Javicard',short:'Negocio',c:'#5AB0E8'},d:{name:'Tareas domésticas',short:'Casa',c:'#B9B2A3'},e:{name:'Estudios',short:'Estudios',c:'#B79CF0'},c:{name:'Físico',short:'Físico',c:'#FF8A65'}};
const AK=Object.keys(AREAS), AMAX=AK.length*5;
const APP_VERSION='6 oct 2026 · v7';
const HORIZ={mes:'Este mes',tri:'Trimestre',ano:'Este año'};

/* ---------- estado ---------- */
const KEY='javitime3', FB_PATH='javitime3', OLD_PATH='javitime2', OLD_KEY='javitime2', BASE_KEY='jt3_base', PEND_KEY='jt3_pending';
const FIREBASE_CONFIG={apiKey:"AIzaSyACdZKT1NIqgav-7xqVinH06DgkM7_dolA",authDomain:"organizacion-93e07.firebaseapp.com",databaseURL:"https://organizacion-93e07-default-rtdb.firebaseio.com",projectId:"organizacion-93e07",storageBucket:"organizacion-93e07.firebasestorage.app",messagingSenderId:"650906241185",appId:"1:650906241185:web:2f9060552095d4711448e0"};
let bForm={b:'',l:'n',t:'dia',tags:[]}, bancoTag='', curSheet=null;
let state, view=today(), tab='hoy', gPer='mes', gRef=today(), bancoF='todas', draft=null, lastDay=today();
let fbRef=null, fbReady=false, connected=false, needRender=false;

function arr(x){return Array.isArray(x)?x.filter(Boolean):(x&&typeof x==='object'?Object.values(x).filter(Boolean):[])}
function normalize(p){
  p=p||{};const saved=!!p.v;
  const s={v:1,
    tasks:arr(p.tasks),boxes:arr(p.boxes),
    tags:p.tagsInit?arr(p.tags):DEF_TAGS.map(t=>({...t})),tagsInit:1,
    blocks:arr(p.blocks).length?arr(p.blocks):DEF_BLOCKS.map(b=>({...b})),
    fixed:saved?arr(p.fixed):DEF_FIXED.map(f=>({...f,days:[...f.days]})),
    dayInit:p.dayInit||{},principals:p.principals||{},scores:p.scores||{},
    expenses:arr(p.expenses),
    ecats:arr(p.ecats).length?arr(p.ecats):DEF_ECATS.map(c=>({...c})),
    budget:+p.budget||0,goals:arr(p.goals),notes:arr(p.notes),folders:arr(p.folders),
    settings:Object.assign({closeAlarm:true},p.settings||{})};
  s.fixed.forEach(f=>f.days=arr(f.days).map(Number));
  s.tasks.forEach(t=>{t.tags=arr(t.tags);t.subs=arr(t.subs)});
  s.folders.forEach(f=>f.items=arr(f.items));
  s.pomoLog=p.pomoLog||{};
  if(!s.settings.blocksV2){[{id:'estudio',name:'Estudio',emoji:'📚',color:'#D9C36A'},{id:'fisico',name:'Tareas físicas',emoji:'🏋️',color:'#8FD16A'}].forEach((b,i)=>{if(!s.blocks.some(x=>x.id===b.id))s.blocks.push({...b,o:900+i})});s.settings.blocksV2=1;}
  ['blocks','ecats','tags','fixed','goals','folders'].forEach(c=>{s[c].forEach((x,i)=>{if(x.o==null)x.o=i});s[c].sort((a,b)=>a.o-b.o)});
  Object.keys(s.principals).forEach(k=>{const a=arr(s.principals[k]);s.principals[k]=[a[0]||'',a[1]||'',a[2]||''];});
  return s;
}
function localSave(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function localLoad(){try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}}

/* ---------- sincronización por ítem ----------
   Cada tarea, caja, gasto, etc. se guarda en su propia ruta (tasks/<id>).
   Solo se mandan los cambios, así el celu y la PC nunca se pisan la lista entera.
   Los cambios sin confirmar quedan en "pendientes" (también en el celu) y se reenvían. */
const COLS=['tasks','boxes','expenses','goals','blocks','ecats','tags','fixed','notes','folders'], MAPS=['dayInit','principals','scores','pomoLog'];
function stable(x){if(Array.isArray(x))return '['+x.map(stable).join(',')+']';if(x&&typeof x==='object')return '{'+Object.keys(x).filter(k=>x[k]!==undefined).sort().map(k=>JSON.stringify(k)+':'+stable(x[k])).join(',')+'}';return JSON.stringify(x===undefined?null:x)}
function flatten(st){const f={};
  COLS.forEach(c=>(st[c]||[]).forEach(x=>{if(x&&x.id)f[c+'/'+x.id]=stable(x)}));
  MAPS.forEach(m=>Object.keys(st[m]||{}).forEach(k=>f[m+'/'+k]=stable(st[m][k])));
  f.settings=stable(st.settings||{});f.budget=stable(+st.budget||0);f.v='1';f.tagsInit='1';
  return f;}
function unflatten(f){const p={};
  for(const k in f){const i=k.indexOf('/');const v=JSON.parse(f[k]);if(i<0)p[k]=v;else{const c=k.slice(0,i);(p[c]=p[c]||{})[k.slice(i+1)]=v}}
  return p;}
const readJ=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}};
let base=readJ(BASE_KEY,null), baseLoaded=!!base, pending=readJ(PEND_KEY,{});
if(!base)base={};
function storeSync(){try{localStorage.setItem(BASE_KEY,JSON.stringify(base));localStorage.setItem(PEND_KEY,JSON.stringify(pending))}catch(e){}}
function save(){
  ['blocks','ecats','tags','fixed','goals','folders'].forEach(c=>state[c].forEach((x,i)=>{if(x.o==null)x.o=Date.now()+i}));
  localSave();
  if(!baseLoaded&&!fbReady)return;            // celu nuevo: esperar a la nube antes de mandar nada
  const cur=flatten(state);let n=0;
  for(const k in cur)if(cur[k]!==base[k]){pending[k]=JSON.parse(cur[k]);base[k]=cur[k];n++}
  for(const k in base)if(!(k in cur)){pending[k]=null;delete base[k];n++}
  if(n)storeSync();
  push();
}
function push(){
  updDot();
  if(!fbRef||!fbReady)return;
  const keys=Object.keys(pending);if(!keys.length)return;
  const batch={};keys.forEach(k=>batch[k]=pending[k]);
  fbRef.update(batch).then(()=>{
    keys.forEach(k=>{if(stable(pending[k])===stable(batch[k]))delete pending[k]});storeSync();updDot();
  }).catch(e=>{console.warn('sync',e);updDot()});
}
function updDot(){setSync(!fbRef?'off':!connected?'off':Object.keys(pending).length?'pend':'on')}
function setSync(s){const el=$('#syncDot');if(el)el.className='sync '+s;window._sync=s}
function applyRemote(v){
  const remote=normalize(Object.assign({},v,{v:1,tagsInit:1}));
  base=flatten(remote);
  const flat=Object.assign({},base);
  for(const k in pending){if(pending[k]===null)delete flat[k];else flat[k]=stable(pending[k])}
  const before=stable(flatten(state));
  state=normalize(Object.assign(unflatten(flat),{v:1,tagsInit:1}));
  baseLoaded=true;storeSync();localSave();
  return before!==stable(flatten(state));
}
function renderKeep(){
  if($('#sheet').classList.contains('open')){needRender=true;return}
  const vals={};document.querySelectorAll('#main input[id]').forEach(i=>{if(i.type!=='date'&&i.value)vals[i.id]=i.value});
  const ae=document.activeElement&&document.activeElement.id;
  render();
  for(const id in vals){const i=document.getElementById(id);if(i)i.value=vals[id]}
  if(ae){const i=document.getElementById(ae);if(i&&i.focus)i.focus()}
}
function initFB(){
  if(!window.firebase){setSync('off');return}
  try{
    firebase.initializeApp(FIREBASE_CONFIG);
    const db=firebase.database();
    fbRef=db.ref(FB_PATH);
    db.ref('.info/connected').on('value',sn=>{connected=!!sn.val();updDot();if(connected)push()});
    fbRef.on('value',snap=>{
      const v=snap.val();
      if(!fbReady&&!v){
        // primera vez: migrar desde la versión anterior (javitime2) o desde lo local
        db.ref(OLD_PATH).once('value').then(o=>{
          const src=o.val()||readJ(OLD_KEY,null)||localLoad();
          state=normalize(src);fbReady=true;baseLoaded=true;
          const f=flatten(state);base={};pending={};
          fbRef.set(unflatten(f)).then(()=>{base=f;storeSync();updDot()});
          afterLoad();render();updDot();
        });
        return;
      }
      if(!v)return;
      const first=!fbReady;fbReady=true;
      const changed=applyRemote(v);
      afterLoad();
      if(first)render();else if(changed)renderKeep();
      push();
    },e=>{console.warn(e);setSync('off')});
  }catch(e){console.warn(e);setSync('off')}
}

/* ---------- lógica de días ---------- */
const blockOf=id=>state.blocks.find(b=>b.id===id)||{id:'',name:'Tareas sueltas',emoji:'📝',color:'#8D96AC'};
const AVISOS=[[-1,'Sin aviso'],[0,'Al empezar'],[5,'5 min antes'],[10,'10 min antes'],[15,'15 min antes'],[20,'20 min antes'],[30,'30 min antes']];
const avisoOf=b=>b.avisoMin!=null?+b.avisoMin:(b.aviso===false?-1:0);
const bellTxt=b=>{const o=avisoOf(b);return o<0?'':o?' 🔔'+o+'′':' 🔔'};
const tagOf=id=>state.tags.find(t=>t.id===id);
const tagPills=t=>{const a=(t.tags||[]).map(tagOf).filter(Boolean);return a.length?'<span class="tagrow">'+a.map(g=>`<span class="tagp" style="--tc:${g.color}">${esc(g.name)}</span>`).join('')+'</span>':''};
const blockOpts=sel=>`<option value="" ${!sel?'selected':''}>📝 Sin bloque (tarea suelta)</option>`+state.blocks.map(b=>`<option value="${b.id}" ${b.id===sel?'selected':''}>${b.emoji} ${esc(b.name)}</option>`).join('')+'<option value="__new">➕ Nuevo bloque…</option>';
const catOpts=sel=>state.ecats.map(c=>`<option value="${c.id}" ${c.id===sel?'selected':''}>${c.emoji} ${esc(c.name)}</option>`).join('')+'<option value="__new">➕ Nueva categoría…</option>';
const tagChips=(sel,act)=>state.tags.map(g=>`<button class="chip ${sel.includes(g.id)?'on':''}" style="--cc:${g.color}" data-act="${act}" data-id="${g.id}">${esc(g.name)}</button>`).join('');
const catOf=id=>state.ecats.find(c=>c.id===id)||{id:'',name:'Otros',emoji:'📌',budget:0};
const boxesOf=d=>state.boxes.filter(b=>b.date===d).sort((a,b)=>a.start-b.start);
const tasksOfBox=id=>state.tasks.filter(t=>t.boxId===id&&t.status==='plan');
const banco=()=>state.tasks.filter(t=>t.status==='banco'&&!t.done);
function newTask(o){return Object.assign({id:uid(),text:'',blockId:'',tipo:'dia',nivel:'n',due:'',status:'banco',date:'',boxId:'',done:false,doneAt:'',reprog:0,tags:[],missed:false,missedFrom:'',created:today()},o)}

function rollover(){
  const t=today();let ch=false;
  state.tasks.forEach(k=>{
    if(k.status==='plan'&&!k.done&&k.date&&k.date<t){
      k.status='banco';k.missed=true;k.reprog=(k.reprog||0)+1;k.missedFrom=k.date;k.boxId='';k.date='';ch=true;}
    if(k.status==='banco'&&!k.done&&k.tipo==='dia'&&k.due&&k.due<t&&!k.missed){k.missed=true;k.missedFrom=k.due;ch=true;}
  });
  return ch;
}
function ensureDay(d){
  if(d<today())return false;let ch=false;
  if(!state.dayInit[d]){
    state.fixed.forEach(f=>{if(f.days.includes(dow(d)))state.boxes.push({id:'fx'+f.id+d.replace(/-/g,''),date:d,start:f.start,dur:f.dur,blockId:f.blockId,title:f.title||'',aviso:avisoOf(f)>=0,avisoMin:avisoOf(f),fixedId:f.id})});
    state.dayInit[d]=1;ch=true;
  }
  state.tasks.forEach(t=>{if(t.status==='banco'&&!t.done&&t.tipo==='dia'&&t.due===d&&t.pulled!==d){t.status='plan';t.date=d;t.boxId='';t.pulled=d;ch=true}});
  return ch;
}
function afterLoad(){
  const a=rollover(),b=ensureDay(view),c=view!==today()&&ensureDay(today());
  if(a||b||c)save();
}

/* ---------- render principal ---------- */
function render(){
  document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
  const miss=banco().filter(t=>t.missed).length;
  $('#bancoBadge').innerHTML=miss?'<span class="badge">'+miss+'</span>':'';
  renderHeader();
  $('#main').innerHTML=tab==='hoy'?viewHoy():tab==='banco'?viewBanco():tab==='gastos'?viewGastos():tab==='stats'?viewStats():tab==='notas'?viewNotas():viewMetas();
}
function renderHeader(){
  let h;
  if(tab==='hoy'){
    const d=parse(view);const isT=view===today();
    const rel=isT?'Hoy':view===addDays(today(),1)?'Mañana':view===addDays(today(),-1)?'Ayer':'';
    h=`<button class="iconbtn" data-act="day" data-n="-1" aria-label="Día anterior">‹</button>
      <div class="htitle"><h1>${DIAS_L[dow(view)-1]} ${d.getDate()}</h1><div class="sub">${rel?rel+', ':''}${MES[d.getMonth()]}</div></div>
      ${isT?'':'<button class="todaypill" data-act="goToday">Ir a hoy</button>'}
      <button class="iconbtn" data-act="day" data-n="1" aria-label="Día siguiente">›</button>
      <button class="iconbtn" data-act="cal" aria-label="Calendario">📅</button>`;
  }else{
    const t={banco:['Banco de tareas','Todo lo pendiente, agrupado por bloque'],gastos:['Gastos personales','Lo que gastás y cuánto te queda'],metas:['Metas','Tu rumbo y cómo vienen tus días'],stats:['Progreso','Medí cómo mejorás día a día'],notas:['Notas y carpetas','Ideas, listas y tareas complejas']}[tab];
    h=`<button class="iconbtn" data-act="tab" data-t="hoy" aria-label="Volver a Hoy">‹</button><div class="htitle"><h1>${t[0]}</h1><div class="sub">${t[1]}</div></div>`;
  }
  h+=`<span class="sync ${window._sync||''}" id="syncDot" title="Sincronización"></span><button class="iconbtn" data-act="settings" aria-label="Configuración">⚙︎</button>`;
  $('#hdr').innerHTML=h;
}

/* ---------- HOY ---------- */
function heroHTML(){
  const isT=view===today(), boxes=boxesOf(view);
  if(!isT){
    const mins=boxes.reduce((a,b)=>a+b.dur,0);
    const past=view<today();
    let done=0,tot=0;boxes.forEach(b=>{const ts=tasksOfBox(b.id);tot+=ts.length;done+=ts.filter(t=>t.done).length});
    return `<div class="hero"><div class="hk">${past?'Así quedó este día':'Planificando'}</div>
      <div class="hbig">${fmtDur(mins)||'0 min'}</div>
      <div class="hname">${boxes.length} caja${boxes.length===1?'':'s'} ${past?'':'armada'+(boxes.length===1?'':'s')}</div>
      <div class="hnext">${tot?done+' de '+tot+' tareas hechas':'Tocá un espacio libre para armar una caja.'}</div></div>`;
  }
  const n=nowMin();
  const cur=boxes.find(b=>n>=b.start&&n<b.start+b.dur);

      return s;}
    if(past)return '';
    return `<div class="gap"><span></span><button class="g" data-act="newBox" data-s="${a}"><span>Libre ${hm(a)} a ${b>=1440?'00:00':hm(b)} (${fmtDur(b-a)})</span><span class="plus">+ caja</span></button></div>`;};

      <button class="btn grow" data-act="ics">📆 Al calendario</button></div>`;
  }

  // sin horario
  const loose=state.tasks.filter(t=>t.status==='plan'&&t.date===view&&!t.boxId);

  // gasto rápido

  h+=`<div class="sec"><h2>Anotar gasto</h2><span class="side">${gd===today()?'Hoy':'Este día'}: ${money(dayTot)}</span></div>
    <div class="card stack">
      <div class="row"><input id="qAmt" inputmode="decimal" placeholder="Monto" style="flex:0 0 38%"><select id="qCat" class="grow">${catOpts(state.ecats[0]&&state.ecats[0].id)}</select></div>
      <div class="row"><input id="qDet" class="grow" placeholder="Detalle (opcional)"><button class="btn primary" data-act="qExp" data-d="${gd}">Anotar</button></div>
    </div>`;

  // cierre
  const sc=state.scores[view]||{};
  h+=`<div class="sec"><h2>Cierre del día</h2><span class="side">Puntuá cada área</span></div><div class="card score">`+
    Object.entries(AREAS).map(([k,a])=>`<div class="srow"><span class="sl">${a.name}</span><div class="dots">${[1,2,3,4,5].map(v=>`<button class="sd ${(sc[k]||0)>=v?'on':''}" style="--sc:${a.c}" data-act="score" data-k="${k}" data-v="${v}">${v}</button>`).join('')}</div></div>`).join('')+'</div>';
  h+=`<div class="empty" style="text-align:center;font-size:12px">JaviTime ${APP_VERSION}</div>`;
  return h;
}

/* ---------- GASTOS ---------- */
function gRange(){
  if(gPer==='dia')return [gRef,gRef];
  if(gPer==='sem'){const m=mondayOf(gRef);return [m,addDays(m,6)]}
  const d=parse(gRef);return [ymd(new Date(d.getFullYear(),d.getMonth(),1)),ymd(new Date(d.getFullYear(),d.getMonth()+1,0))];
}
function prorate(monthly){if(!monthly)return 0;if(gPer==='mes')return monthly;if(gPer==='sem')return monthly*7/dim(gRef);return monthly/dim(gRef)}
function gLabel(){const [a,b]=gRange();const A=parse(a),B=parse(b);
  if(gPer==='dia')return DIAS[dow(a)-1]+' '+A.getDate()+' de '+MES[A.getMonth()];
  if(gPer==='sem')return A.getDate()+(A.getMonth()!==B.getMonth()?' '+MES[A.getMonth()].slice(0,3):'')+' al '+B.getDate()+' '+MES[B.getMonth()].slice(0,3);
  return cap(MES[A.getMonth()])+' '+A.getFullYear();}
function barClass(v,b){if(!b)return '';const r=v/b;return r>1?'over':r>.8?'warn':''}
function viewGastos(){
  const [a,b]=gRange();
  const ex=state.expenses.filter(e=>e.date>=a&&e.date<=b);
  const tot=ex.reduce((s,e)=>s+e.amount,0);
  const bud=prorate(state.budget);
  let h=`<div class="seg">${[['dia','Día'],['sem','Semana'],['mes','Mes']].map(([k,v])=>`<button class="${gPer===k?'on':''}" data-act="gp" data-p="${k}">${v}</button>`).join('')}</div>
  <div class="pnav"><button class="iconbtn" data-act="gnav" data-n="-1" aria-label="Anterior">‹</button><b>${gLabel()}</b><button class="iconbtn" data-act="gnav" data-n="1" aria-label="Siguiente">›</button></div>
  <div class="card"><div class="row" style="justify-content:space-between;align-items:flex-end"><div><div class="muted" style="font-size:13px">Gastaste</div><div class="total">${money(tot)}</div></div>
    ${bud?`<div style="text-align:right"><div class="muted" style="font-size:13px">${gPer==='mes'?'Presupuesto':'Presupuesto proporcional'}</div><b style="font-family:var(--disp);font-size:18px">${money(bud)}</b></div>`:`<button class="link" data-act="gset">Poner presupuesto</button>`}</div>
    ${bud?`<div class="pbar" style="margin-top:12px"><i class="${barClass(tot,bud)}" style="width:${Math.min(100,tot/bud*100)}%"></i></div><div class="muted" style="font-size:13px;margin-top:6px">${tot<=bud?'Te quedan '+money(bud-tot):'Te pasaste '+money(tot-bud)}</div>`:''}`;
  if(gPer!=='dia'){
    const days=[];for(let d=a;d<=b;d=addDays(d,1))days.push(d);
    const vals=days.map(d=>ex.filter(e=>e.date===d).reduce((s,e)=>s+e.amount,0));
    const mx=Math.max(1,...vals);
    h+=`<div class="chart">${days.map((d,i)=>`<div class="c ${d===today()?'today':''}" title="${d}: ${money(vals[i])}"><i class="${vals[i]?'has':''}" style="height:${vals[i]/mx*100}%"></i><span>${gPer==='sem'?DIAS[i]:((i+1)%5===0||i===0?parse(d).getDate():'')}</span></div>`).join('')}</div>`;
  }
  h+='</div>';
  // agregar
  h+=`<div class="sec"><h2>Anotar gasto</h2></div><div class="card stack">
    <div class="row"><input id="gAmt" inputmode="decimal" placeholder="Monto" style="flex:0 0 38%"><select id="gCat" class="grow">${catOpts(state.ecats[0]&&state.ecats[0].id)}</select></div>
    <div class="row"><input id="gDet" class="grow" placeholder="Detalle"><input id="gDate" type="date" value="${today()}" style="flex:0 0 42%"></div>
    <button class="btn primary block" data-act="gAdd">Anotar gasto</button></div>`;
  // por categoría
  h+=`<div class="sec"><h2>Por categoría</h2><button class="link" data-act="gset">Presupuestos</button></div><div class="card" style="padding:4px 14px">`;
  const byCat=state.ecats.map(c=>({c,v:ex.filter(e=>e.cat===c.id).reduce((s,e)=>s+e.amount,0),b:prorate(+c.budget||0)}))
    .filter(x=>x.v||x.b).sort((x,y)=>y.v-x.v);
  if(!byCat.length)h+='<div class="empty">Sin gastos en este período.</div>';
  byCat.forEach(({c,v,b})=>{const ref=b||tot||1;
    h+=`<div class="catrow"><div class="top"><b>${c.emoji} ${esc(c.name)}</b><span>${money(v)}${b?' <span class="muted">de '+money(b)+'</span>':(tot?' <span class="muted">'+Math.round(v/tot*100)+'%</span>':'')}</span></div>
      <div class="pbar"><i class="${barClass(v,b)}" style="width:${Math.min(100,v/ref*100)}%;${b?'':'background:var(--mu)'}"></i></div></div>`;});
  h+='</div>';
  // lista
  h+=`<div class="sec"><h2>Movimientos</h2><span class="side">${ex.length}</span></div><div class="card" style="padding:4px 14px">`;
  if(!ex.length)h+='<div class="empty">Nada anotado todavía.</div>';
  ex.slice().sort((x,y)=>(y.date+y.ts).localeCompare(x.date+x.ts)).slice(0,60).forEach(e=>{const c=catOf(e.cat);const d=parse(e.date);
    h+=`<div class="exp"><span class="em">${c.emoji}</span><div class="d">${esc(e.detail||c.name)}<small>${c.name}, ${DIAS[dow(e.date)-1]} ${d.getDate()}/${d.getMonth()+1}</small></div><span class="m">${money(e.amount)}</span><button class="x" data-act="gDel" data-id="${e.id}" aria-label="Borrar gasto">✕</button></div>`;});
  h+='</div>';
  return h;
}

/* ---------- PROGRESO (estadísticas) ---------- */
let sPer=7;
function dayStats(d){
  const P=(state.principals[d]||[]).filter(Boolean);
  const pt=P.map(id=>state.tasks.find(t=>t.id===id)).filter(Boolean);
  const pDone=pt.filter(t=>t.done).length;
  const doneT=state.tasks.filter(t=>t.done&&t.doneAt===d);
  const otherT=doneT.filter(t=>!P.includes(t.id));
  const missed=state.tasks.filter(t=>t.missedFrom===d).length+(d===today()?state.tasks.filter(t=>t.status==='plan'&&t.date===d&&!t.done&&!P.includes(t.id)).length:0)+(pt.length-pDone);
  const sc=state.scores[d]||{};const score=AK.reduce((a,k)=>a+(sc[k]||0),0);
  const spent=state.expenses.filter(e=>e.date===d).reduce((a,e)=>a+e.amount,0);
  return {pSet:pt.length,pDone,others:otherT.length,otherT,done:pDone+otherT.length,missed,score,sc,spent,pomos:+state.pomoLog[d]||0};
}
function streaks(){
  const ok=d=>{const s=dayStats(d);return s.pSet===3&&s.pDone===3};
  let cur=0,d=today();if(!ok(d))d=addDays(d,-1);
  while(ok(d)&&cur<400){cur++;d=addDays(d,-1)}
  const keys=Object.keys(state.principals).sort();let best=0,run=0,prev='';
  keys.forEach(k=>{if(ok(k)){run=(prev&&addDays(prev,1)===k)?run+1:1;best=Math.max(best,run);prev=k}else{run=0;prev=''}});
  return {cur,best:Math.max(best,cur)};
}
function delta(a,b,lowerBetter){if(!b&&!a)return '<div class="dl eq">sin datos previos</div>';if(!b)return '<div class="dl up">▲ nuevo</div>';
  const pct=Math.round((a-b)/b*100);if(pct===0)return '<div class="dl eq">= igual que antes</div>';
  const good=lowerBetter?pct<0:pct>0;return `<div class="dl ${good?'up':'dn'}">${pct>0?'▲':'▼'} ${Math.abs(pct)}% vs período anterior</div>`}
function bars(days,series,max,h){
  max=Math.max(1,max);
  return `<div class="bars" style="--h:${h||120}px">${days.map((d,i)=>{
    const lab=sPer===7?DIAS[dow(d)-1].slice(0,2):((i%5===0||d===today())?parse(d).getDate():'');
    return `<div class="c ${d===today()?'td':''}" title="${d}"><div class="st">${series.map(s=>s.vals[i]?`<i style="height:${s.vals[i]/max*100}%;background:${s.c}"></i>`:'').join('')}</div><span>${lab}</span></div>`}).join('')}</div>`}

  const doneAvg=sum(S,s=>s.done)/N,doneAvgP=sum(Sp,s=>s.done)/N;
  const pRate=sum(S,s=>s.pSet)?sum(S,s=>s.pDone)/sum(S,s=>s.pSet)*100:0,pRateP=sum(Sp,s=>s.pSet)?sum(Sp,s=>s.pDone)/sum(Sp,s=>s.pSet)*100:0;

  const wd=[0,0,0,0,0,0,0],wc=[0,0,0,0,0,0,0];for(let i=0;i<56;i++){const d=addDays(today(),-i);const s=dayStats(d);if(s.done||s.missed){wd[dow(d)-1]+=s.done;wc[dow(d)-1]++}}

  else if(pRate<70)tips.push(['🎯',`Cumplís el ${Math.round(pRate)}% de tus principales. Probá con tareas más chicas o metelas en la primera caja del día.`]);
  if(wmax>0){const bi=wavg.indexOf(wmax);tips.push(['🗓️',`Tu día más productivo suele ser el ${DIAS_L[bi].toLowerCase()} (${wmax.toFixed(1)} tareas en promedio).`])}
  const low=aAvg.filter(a=>a.v).sort((a,b)=>a.v-b.v)[0];if(low&&low.v<3)tips.push(['⚖️',`El área más floja es ${AREAS[low.k].name} (${low.v.toFixed(1)}/5). Reservale una caja fija.`]);
  const pend=banco().filter(t=>(t.reprog||0)>=2).sort((a,b)=>b.reprog-a.reprog);
  if(pend.length)tips.push(['🐸',`Venís pateando "${esc(pend[0].text)}" (${pend[0].reprog} veces). Hacela primera mañana o partila en algo más chico.`]);
  if(spP&&sp>spP*1.15)tips.push(['💸',`Gastaste ${Math.round((sp-spP)/spP*100)}% más que en el período anterior.`]);
  if(!pom)tips.push(['🍅','Probá un pomodoro en tu tarea más importante: 25 minutos sin el celu.']);
  h+=`<div class="sec"><h2>Para mejorar</h2></div><div class="card" style="padding:4px 14px">${tips.length?tips.map(([i,t])=>`<div class="insight"><span>${i}</span><span>${t}</span></div>`).join(''):'<div class="empty">Usá la app unos días y acá aparecen consejos según tus datos.</div>'}</div>`;
  h+=`<div class="sec"><h2>Tareas por día de la semana</h2><span class="side">últimas 8 semanas</span></div><div class="card"><div class="bars" style="--h:90px">${wavg.map((v,i)=>`<div class="c"><div class="st">${v?`<i style="height:${v/Math.max(1,wmax)*100}%;background:${v===wmax?'#F2B544':'#5AB0E8'}"></i>`:''}</div><span>${DIAS[i]}</span></div>`).join('')}</div></div>`;
  if(pend.length)h+=`<div class="sec"><h2>Las que más pateás</h2></div><div class="card" style="padding:4px 14px">${pend.slice(0,5).map(t=>`<div class="titem"><span class="body"><span class="tx">${esc(t.text)}</span><span class="meta"><span class="miss">↻ ${t.reprog} veces</span></span></span><button class="ib" data-act="editTask" data-id="${t.id}" aria-label="Editar">✎</button></div>`).join('')}</div>`;
  return h;
}

function viewMetas(){
  let h='';
  const fg=state.goals.find(g=>g.focus);
  h+=`<div class="hero" style="--hc:var(--amber)"><div class="hk">Foco del mes</div>
    ${fg?`<div class="hname" style="font-size:20px;margin-top:4px">${esc(fg.text)}</div><div class="hbar"><i style="width:${fg.progress||0}%"></i></div><div class="hnext">${fg.progress||0}% hecho. Si una tarea no acerca esto ni mantiene el negocio andando, borrala.</div>`
      :`<div class="hname" style="margin-top:4px">Marcá con ★ la meta más importante del mes.</div><div class="hnext">Va a aparecer arriba de tu día para no perder el rumbo.</div>`}</div>`;
  h+=`<div class="card stack"><input id="mTxt" placeholder="Nueva meta"><div class="row"><select id="mArea" class="grow">${Object.entries(AREAS).map(([k,a])=>`<option value="${k}">${a.name}</option>`).join('')}</select>
    <select id="mHor" class="grow">${Object.entries(HORIZ).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></div><button class="btn primary block" data-act="mAdd">Agregar meta</button></div>`;
  ['mes','tri','ano'].forEach(hk=>{const gs=state.goals.filter(g=>g.horizon===hk);if(!gs.length)return;
    h+=`<div class="sec"><h2>${HORIZ[hk]}</h2></div><div class="card" style="padding:2px 14px">`+gs.map(g=>{const a=AREAS[g.area]||AREAS.j;
      return `<div class="goal"><div class="gt"><button class="star ${g.focus?'on':''}" data-act="mFocus" data-id="${g.id}" aria-label="Foco del mes">★</button><span class="tx">${esc(g.text)}</span><button class="x" data-act="mDel" data-id="${g.id}" aria-label="Borrar meta">✕</button></div>
        <div class="gm"><span style="color:${a.c}">${a.name}</span><input type="range" min="0" max="100" step="5" value="${g.progress||0}" data-goal="${g.id}" aria-label="Progreso"><b style="color:var(--tx);width:36px;text-align:right">${g.progress||0}%</b></div></div>`}).join('')+'</div>';});
  // stats
  const days=[];for(let i=13;i>=0;i--)days.push(addDays(today(),-i));
  const wk=mondayOf(today()),pwk=addDays(wk,-7);
  const avg=(from,to)=>{const v=[];for(let d=from;d<=to;d=addDays(d,1)){const s=state.scores[d];if(s&&AK.some(k=>s[k]))v.push(AK.reduce((a,k)=>a+(s[k]||0),0))}return v.length?v.reduce((a,b)=>a+b,0)/v.length:0};
  const aw=avg(wk,today()),ap=avg(pwk,addDays(wk,-1));
  const doneW=state.tasks.filter(t=>t.done&&t.doneAt>=wk).length;
  const missW=state.tasks.filter(t=>t.missedFrom&&t.missedFrom>=wk).length;
  h+=`<div class="sec"><h2>Cómo vienen tus días</h2><span class="side">Últimos 14</span></div>
    <div class="stats"><div class="stat"><b>${aw?aw.toFixed(1):'–'}<span style="font-size:15px;color:var(--mu)">/${AMAX}</span></b><span>Puntaje promedio esta semana${ap?(aw>=ap?', subiendo':', bajando'):''}</span></div>
    <div class="stat"><b>${doneW}</b><span>Tareas hechas esta semana${missW?', '+missW+' se pasaron al banco':''}</span></div></div>
    <div class="card" style="margin-top:8px"><div class="schart">${days.map(d=>{const s=state.scores[d]||{};
      return `<div class="c" title="${d}">${AK.slice().reverse().map(k=>`<i style="height:${(s[k]||0)/AMAX*100}%;background:${AREAS[k].c}"></i>`).join('')}<span>${parse(d).getDate()}</span></div>`}).join('')}</div>
    <div class="legend">${Object.values(AREAS).map(a=>`<span><i style="background:${a.c}"></i>${a.name}</span>`).join('')}</div></div>`;
  return h;
}

function boxSave(){
  const d=draft,b=d.b;const nt=$('#dNew');if(nt&&nt.value.trim()){d.news.push(nt.value.trim())}
  const end=b.start+b.dur;
  if(end>1440){toast('La caja se pasa de las 00:00');return}
  const clash=boxesOf(b.date).find(x=>x.id!==b.id&&x.start<end&&b.start<x.start+x.dur);
  if(clash){toast('Se pisa con '+(clash.title||blockOf(clash.blockId).name)+' ('+hm(clash.start)+')');return}
  if(d.isNew)state.boxes.push(b);else{const i=state.boxes.findIndex(x=>x.id===b.id);state.boxes[i]=b}
  d.news.forEach(text=>state.tasks.push(newTask({text,blockId:b.blockId,status:'plan',date:b.date,boxId:b.id})));
  d.ids.forEach(id=>{const t=state.tasks.find(x=>x.id===id);if(t){t.status='plan';t.date=b.date;t.boxId=b.id;}});
  d.orig.filter(id=>!d.ids.includes(id)).forEach(id=>{const t=state.tasks.find(x=>x.id===id);if(t&&!t.done){t.status='banco';t.boxId='';t.date=''}});
  save();closeSheet();render();toast('Caja guardada');
}

/* ---------- avisos y alarma ---------- */
let swReg=null;
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){navigator.serviceWorker.register('sw.js').then(r=>swReg=r).catch(()=>{})}
let fired;try{fired=new Set(JSON.parse(localStorage.getItem('jt2_fired')||'[]'))}catch(e){fired=new Set()}
function markFired(k){fired.add(k);const a=[...fired].slice(-80);try{localStorage.setItem('jt2_fired',JSON.stringify(a))}catch(e){}}
let actx=null;
function beep(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const t0=actx.currentTime;
  [0,.35,.7,1.4,1.75,2.1].forEach(dt=>{const o=actx.createOscillator(),g=actx.createGain();o.type='sine';o.frequency.value=880;g.gain.setValueAtTime(.0001,t0+dt);g.gain.exponentialRampToValueAtTime(.4,t0+dt+.02);g.gain.exponentialRampToValueAtTime(.0001,t0+dt+.25);o.connect(g).connect(actx.destination);o.start(t0+dt);o.stop(t0+dt+.3)})}catch(e){}}
function notify(title,body){
  if(!('Notification' in window)||Notification.permission!=='granted')return;
  try{if(swReg&&swReg.showNotification){swReg.showNotification(title,{body,tag:title,vibrate:[300,100,300]});return}new Notification(title,{body})}catch(e){}
}
function alarm(title,body){
  $('#alT').textContent=title;$('#alB').textContent=body;$('#alarm').classList.add('open');
  beep();if(navigator.vibrate)navigator.vibrate([400,150,400,150,700]);notify(title,body);
}
function tick(){
  const t=today(),n=nowMin();
  if(t!==lastDay){const was=lastDay;lastDay=t;rollover();ensureDay(t);if(view===was)view=t;save();render();}
  renderHero();
  boxesOf(t).forEach(b=>{const off=avisoOf(b);if(off<0)return;const at=b.start-off,k=t+b.id+'@'+off;
    if(n>=at&&n<at+15&&n<b.start+b.dur&&!fired.has(k)){markFired(k);const bl=blockOf(b.blockId);
      const ts=tasksOfBox(b.id).filter(x=>!x.done).map(x=>x.text);const left=b.start-n;
      alarm(bl.emoji+' '+(b.title||bl.name),(left>0?'Empieza en '+left+' min ('+hm(b.start)+')':'Empieza ahora')+'. Caja de '+fmtDur(b.dur)+(ts.length?': '+ts.slice(0,3).join(', '):''));}});
  state.tasks.forEach(x=>{if(!x.alarm||x.done)return;if(!(x.status==='plan'&&x.date===t)&&x.due!==t)return;
    const [h,m]=x.alarm.split(':').map(Number),at=h*60+m,k=t+x.id+'@'+x.alarm;
    if(n>=at&&n<at+15&&!fired.has(k)){markFired(k);alarm('⏰ '+x.text,'Alarma de las '+x.alarm)}});
  if(state.settings.closeAlarm&&n>=1410&&n<1412&&!fired.has(t+'close')){markFired(t+'close');alarm('Cierre del día','Marcá lo hecho y puntuá el día. Lo pendiente se va al banco.')}
}

/* ---------- pomodoro ----------
   El tiempo se calcula con la hora de fin, así que aunque el celu se bloquee y pause la app,
   al volver el reloj está bien y te avisa si terminó. Además mantiene la pantalla encendida (Wake Lock). */
let pomo=readJ('jt3_pomo',null), wake=null;
const PD=()=>({foco:state.settings.pFoco||25,corto:state.settings.pCorto||5,largo:state.settings.pLargo||15});
const PN={foco:'Foco',corto:'Descanso',largo:'Descanso largo'};
function pomoStore(){try{localStorage.setItem('jt3_pomo',JSON.stringify(pomo))}catch(e){}}
async function requestWake(){if(state.settings.pWake===false)return;try{if('wakeLock' in navigator&&!wake){wake=await navigator.wakeLock.request('screen');wake.addEventListener('release',()=>{wake=null;pomoRender()})}}catch(e){}pomoRender()}
function releaseWake(){try{if(wake)wake.release()}catch(e){}wake=null}
function pomoLeft(){if(!pomo)return 0;return pomo.running?Math.max(0,Math.round((pomo.endAt-Date.now())/1000)):pomo.left}
function pomoOpen(boxId,taskId){
  boxId=boxId||'';taskId=taskId||'';
  const same=pomo&&pomo.boxId===boxId&&(pomo.taskId||'')===taskId;
  if(pomo&&!same&&pomo.running&&!confirm('Tenés un pomodoro corriendo. ¿Empezar uno nuevo para esto?'))return pomoShow();
  if(!same){
    const t=taskId&&state.tasks.find(x=>x.id===taskId);
    const b=state.boxes.find(x=>x.id===(t&&t.boxId||boxId));const bl=b?blockOf(b.blockId):null;
    const label=t?'✔ '+t.text:(b?bl.emoji+' '+(b.title||bl.name):'Foco libre');
    if(pomo)releaseWake();
    pomo={phase:'foco',left:PD().foco*60,total:PD().foco*60,running:false,count:0,boxId:b?b.id:'',taskId,label};pomoStore();
  }
  if($('#sheet').classList.contains('open')){closeSheet(true);try{history.replaceState({jt:'pomo'},'')}catch(e){}$('#pomo').classList.add('open');pomoRender();pomoPill();return}
  pomoShow();
}
function pomoShow(){if(!$('#pomo').classList.contains('open'))navPush('pomo');$('#pomo').classList.add('open');pomoRender();pomoPill()}
function pomoStart(){pomo.endAt=Date.now()+pomo.left*1000;pomo.running=true;pomoStore();requestWake();pomoRender();
  try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();actx.resume()}catch(e){}}
function pomoPause(){pomo.left=pomoLeft();pomo.running=false;pomoStore();releaseWake();pomoRender()}
function pomoNext(finished){
  if(pomo.phase==='foco'&&finished){pomo.count++;state.pomoLog[today()]=(+state.pomoLog[today()]||0)+1;const b=state.boxes.find(x=>x.id===pomo.boxId);if(b)b.pomos=(b.pomos||0)+1;const tk=pomo.taskId&&state.tasks.find(x=>x.id===pomo.taskId);if(tk)tk.pomos=(tk.pomos||0)+1;save()}
  const nx=pomo.phase==='foco'?(pomo.count&&pomo.count%4===0&&finished?'largo':'corto'):'foco';
  if(finished)alarm(pomo.phase==='foco'?'🍅 ¡Foco terminado!':'☕ Fin del descanso',pomo.phase==='foco'?'Tomate '+PD()[nx]+' minutos de descanso.':'A enfocarse de nuevo: '+PD().foco+' minutos.');
  pomo.phase=nx;pomo.total=PD()[nx]*60;pomo.left=pomo.total;pomo.running=false;pomoStore();releaseWake();pomoRender();render();
}
function pomoRender(){
  const el=$('#pomo .pin');if(!el)return;
  if(!pomo){el.innerHTML='';return}
  const left=pomoLeft(),pc=pomo.phase==='foco'?'var(--amber)':'var(--ok)';
  const mm=pad(Math.floor(left/60))+':'+pad(left%60);
  el.style.setProperty('--pc',pc);
  el.innerHTML=`<div class="ptop"><button class="iconbtn" data-act="pomoHide" aria-label="Volver">‹</button><button class="btn" style="padding:8px 12px;font-size:13px" data-act="pomoWake">${state.settings.pWake===false?'🌙 Pantalla puede apagarse':(wake?'🔆 Pantalla encendida':'🔆 Mantener encendida')}</button><button class="iconbtn" data-act="pomoStop" aria-label="Terminar">✕</button></div>
    <div class="pphase">${PN[pomo.phase]}</div>
    <div class="ptime" id="pTime">${mm}</div>
    <div class="plabel">${esc(pomo.label)}</div>
    <div class="pbarw"><i id="pBar" style="width:${Math.round((1-left/pomo.total)*100)}%"></i></div>
    <div class="pdots">${[0,1,2,3].map(i=>`<i class="${i<(pomo.count%4||(pomo.count&&pomo.phase==='largo'?4:0))?'on':''}"></i>`).join('')}</div>
    <div class="pctl"><button class="btn primary" data-act="pomoGo">${pomo.running?'⏸ Pausa':(pomo.left<pomo.total?'▶ Seguir':'▶ Empezar '+PN[pomo.phase].toLowerCase())}</button><button class="btn" data-act="pomoSkip">⏭ Saltar</button></div>
    ${pomo.taskId?(()=>{const tk=state.tasks.find(x=>x.id===pomo.taskId);return tk?(tk.done?'<div class="pnote" style="color:var(--ok)">✔ Tarea hecha</div>':'<button class="btn block" style="margin-top:10px" data-act="pomoDone">✔ Terminé la tarea</button>'):''})():''}
    <div class="pnote">${pomo.count} pomodoro${pomo.count===1?'':'s'} en esta sesión.<br>Si el celu se bloquea, el tiempo sigue contando y al desbloquear te avisa. Con la pantalla encendida suena en el momento.</div>`;
}
function pomoPill(){const p=$('#pomoPill');const show=pomo&&!$('#pomo').classList.contains('open');p.classList.toggle('show',!!show);if(show)p.textContent='🍅 '+pad(Math.floor(pomoLeft()/60))+':'+pad(pomoLeft()%60)}
setInterval(()=>{
  if(!pomo)return;
  if(pomo.running&&Date.now()>=pomo.endAt){pomoNext(true);return}
  if(pomo.running){const left=pomoLeft();const t=$('#pTime');if(t)t.textContent=pad(Math.floor(left/60))+':'+pad(left%60);const b=$('#pBar');if(b)b.style.width=Math.round((1-left/pomo.total)*100)+'%'}
  pomoPill();
},500);

/* ---------- calendario (.ics) ---------- */
function icsDT(d,m){let dd=d;if(m>=1440){dd=addDays(d,1);m-=1440}return dd.replace(/-/g,'')+'T'+pad(Math.floor(m/60))+pad(m%60)+'00'}
const icsEsc=s=>String(s).replace(/([,;\\])/g,'\\$1').replace(/\n/g,'\\n');
function downloadICS(){
  const boxes=boxesOf(view).filter(b=>view>today()||b.start+b.dur>nowMin());
  if(!boxes.length&&!state.tasks.some(x=>x.alarm&&!x.done&&((x.status==='plan'&&x.date===view)||x.due===view))){toast('No hay cajas por delante para mandar');return}
  const stamp=new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z';
  let s='BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//JaviTime//ES\r\nCALSCALE:GREGORIAN\r\n';
  boxes.forEach(b=>{const bl=blockOf(b.blockId);const ts=tasksOfBox(b.id).map(t=>'- '+t.text).join('\n');
    s+='BEGIN:VEVENT\r\nUID:'+b.id+'-'+view+'@javitime\r\nDTSTAMP:'+stamp+'\r\nDTSTART:'+icsDT(view,b.start)+'\r\nDTEND:'+icsDT(view,b.start+b.dur)+'\r\nSUMMARY:'+icsEsc(bl.emoji+' '+(b.title||bl.name))+'\r\n'+(ts?'DESCRIPTION:'+icsEsc(ts)+'\r\n':'')+
      (avisoOf(b)>=0?'BEGIN:VALARM\r\nACTION:DISPLAY\r\nDESCRIPTION:'+icsEsc(b.title||bl.name)+'\r\nTRIGGER:-PT'+avisoOf(b)+'M\r\nEND:VALARM\r\n':'')+'END:VEVENT\r\n';});
  state.tasks.filter(x=>x.alarm&&!x.done&&((x.status==='plan'&&x.date===view)||x.due===view)).forEach(x=>{const [h,m]=x.alarm.split(':').map(Number),at=h*60+m;
    s+='BEGIN:VEVENT\r\nUID:'+x.id+'-'+view+'@javitime\r\nDTSTAMP:'+stamp+'\r\nDTSTART:'+icsDT(view,at)+'\r\nDTEND:'+icsDT(view,at+10)+'\r\nSUMMARY:'+icsEsc('⏰ '+x.text)+'\r\nBEGIN:VALARM\r\nACTION:DISPLAY\r\nDESCRIPTION:'+icsEsc(x.text)+'\r\nTRIGGER:-PT0M\r\nEND:VALARM\r\nEND:VEVENT\r\n';});
  s+='END:VCALENDAR\r\n';
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([s],{type:'text/calendar'}));a.download='cajas-'+view+'.ics';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);
  toast('Abrí el archivo para sumarlo a tu calendario');
}

  foldDel:el=>{if(!confirm('¿Borrar la carpeta y sus ítems?'))return;state.folders=state.folders.filter(x=>x.id!==el.dataset.id);save();closeSheet();render()},
  fiTg:el=>{const f=state.folders.find(x=>x.id===el.dataset.id);const x=f&&f.items.find(y=>y.id===el.dataset.s);if(x){x.done=!x.done;save();render();if(f.items.every(y=>y.done))toast(f.name+': ¡todo listo! 👏')}},
  fiAdd:el=>{const i=document.querySelector(`.fiNew[data-id="${el.dataset.id}"]`);const v=i&&i.value.trim();if(!v)return;const f=state.folders.find(x=>x.id===el.dataset.id);f.items.push({id:uid(),text:v,done:false});save();render();const n=document.querySelector(`.fiNew[data-id="${el.dataset.id}"]`);if(n)n.focus()},
  sPer:el=>{sPer=+el.dataset.n;render()},
  qNext:()=>{qOff++;const q=document.querySelector('.quote');if(q)q.outerHTML=quoteHTML()},
  pomoTask:el=>pomoOpen('',el.dataset.id),
  pomoDone:()=>{const tk=pomo&&pomo.taskId&&state.tasks.find(x=>x.id===pomo.taskId);if(tk&&!tk.done){tk.done=true;tk.doneAt=tk.date||today();save();render();toast('Tarea hecha 👏')}pomoRender()},
  pomoShow:()=>pomoShow(),
  pomoHide:()=>{navBack('pomo');$('#pomo').classList.remove('open');pomoPill()},
  pomoGo:()=>{pomo.running?pomoPause():pomoStart()},
  pomoSkip:()=>pomoNext(false),
  pomoStop:()=>{if(!confirm('¿Terminar el pomodoro?'))return;pomo=null;pomoStore();releaseWake();$('#pomo').classList.remove('open');pomoPill()},
  pomoWake:()=>{state.settings.pWake=state.settings.pWake===false;save();if(pomo&&pomo.running){state.settings.pWake===false?releaseWake():requestWake()}pomoRender()},
  dDel:()=>{const b=draft.b;if(!confirm('¿Borrar esta caja? Sus tareas vuelven al banco.'))return;
    tasksOfBox(b.id).forEach(t=>{if(!t.done){t.status='banco';t.boxId='';t.date=''}else t.boxId=''});
    state.boxes=state.boxes.filter(x=>x.id!==b.id);save();closeSheet();render()},
  closeSheet:()=>closeSheet(),
  toBanco:el=>{const t=state.tasks.find(x=>x.id===el.dataset.id);if(t){if(t.due)t.pulled=t.due;t.status='banco';t.date='';t.boxId='';closeSheet();save();render();toast('Volvió al banco')}},
  toHoy:el=>{const t=state.tasks.find(x=>x.id===el.dataset.id);if(t){closeSheet();t.status='plan';t.date=today();t.boxId='';save();render();toast('Pasó a hoy. Metela en una caja.')}},
  pickP:el=>openPick(+el.dataset.slot),
  setP:el=>{const s=+el.dataset.slot,id=el.dataset.id;const P=(state.principals[view]||['','','']).slice();P[s]=id;state.principals[view]=P;
    if(id){const t=state.tasks.find(x=>x.id===id);if(t&&t.status!=='plan'){t.status='plan';t.date=view;t.boxId=''}}
    save();closeSheet();render()},
  setPnew:el=>{const v=$('#pNew').value.trim();if(!v){toast('Escribí la tarea');return}const t=newTask({text:v,status:'plan',date:view,nivel:'a',blockId:''});state.tasks.push(t);
    const P=(state.principals[view]||['','','']).slice();P[+el.dataset.slot]=t.id;state.principals[view]=P;save();closeSheet();render()},
  copyPrev:()=>{const prev=boxesOf(addDays(view,-1)).filter(b=>!b.fixedId);if(!prev.length){toast('Ayer no tenía cajas para copiar');return}
    let c=0;prev.forEach(p=>{const end=p.start+p.dur;if(boxesOf(view).some(x=>x.start<end&&p.start<x.start+x.dur))return;state.boxes.push({id:uid(),date:view,start:p.start,dur:p.dur,blockId:p.blockId,title:p.title||'',aviso:p.aviso!==false});c++});
    save();render();toast(c?c+' caja'+(c===1?'':'s')+' copiada'+(c===1?'':'s')+', sin tareas':'Se pisaban con las de hoy')},
  ics:()=>downloadICS(),
  qExp:el=>{const v=num($('#qAmt').value);if(!v){toast('Poné el monto');return}
    state.expenses.push({id:uid(),date:el.dataset.d,amount:v,cat:$('#qCat').value,detail:$('#qDet').value.trim(),ts:String(Date.now())});save();render();toast('Gasto anotado: '+money(v))},
  score:el=>{const k=el.dataset.k,v=+el.dataset.v;const s=state.scores[view]||{};s[k]=s[k]===v?0:v;state.scores[view]=s;save();render()},
  addBanco:()=>{const v=$('#bTxt').value.trim();if(!v){toast('Escribí la tarea');$('#bTxt').focus();return}
    bForm.b=$('#bBlk').value==='__new'?'':$('#bBlk').value;bForm.l=$('#bLvl').value;bForm.t=$('#bTipo').value;
    const d=$('#bDue').value||'';
    state.tasks.push(newTask({text:v,blockId:bForm.b,tipo:bForm.t,nivel:bForm.l,due:d,tags:bForm.tags.slice()}));
    bForm.tags=[];
    if(d&&d<=today()&&bForm.t==='dia')ensureDay(today());
    save();render();$('#bTxt').focus();toast('Al banco')},
  bTag:el=>{const id=el.dataset.id;bForm.tags=bForm.tags.includes(id)?bForm.tags.filter(x=>x!==id):[...bForm.tags,id];el.classList.toggle('on')},
  eTag:el=>el.classList.toggle('on'),
  btf:el=>{bancoTag=bancoTag===el.dataset.id?'':el.dataset.id;render()},
  newTag:el=>{const n=(prompt('Nombre de la etiqueta')||'').trim();if(!n)return;const g={id:uid(),name:n,color:pickColor(state.tags.length)};state.tags.push(g);save();
    const btn=document.createElement('button');btn.className='chip on';btn.style.setProperty('--cc',g.color);btn.dataset.act=el.dataset.ctx==='b'?'bTag':'eTag';btn.dataset.id=g.id;btn.textContent=g.name;el.before(btn);
    if(el.dataset.ctx==='b')bForm.tags.push(g.id)},
  sAddTag:()=>{readSettings();state.tags.push({id:uid(),name:'Nueva etiqueta',color:pickColor(state.tags.length)});openSettings()},
  sDelTag:el=>{readSettings();state.tags=state.tags.filter(g=>g.id!==el.dataset.id);state.tasks.forEach(t=>t.tags=(t.tags||[]).filter(x=>x!==el.dataset.id));if(bancoTag===el.dataset.id)bancoTag='';openSettings()},
  bf:el=>{bancoF=el.dataset.f;render()},
  editTask:el=>openTask(el.dataset.id),
  eLvl:el=>{document.querySelectorAll('#eLvl .chip').forEach(c=>c.classList.toggle('on',c===el));$('#sheet').dataset.lvl=el.dataset.k},
  eSave:el=>{const t=state.tasks.find(x=>x.id===el.dataset.id);if(!t)return;t.text=$('#eTxt').value.trim()||t.text;t.blockId=$('#eBlk').value==='__new'?'':$('#eBlk').value;t.tags=[...document.querySelectorAll('#eTags .chip.on[data-id]')].map(c=>c.dataset.id);t.alarm=$('#eAlarm').value||'';{const nv=$('#eSubNew');if(nv&&nv.value.trim())subDraft.push({id:uid(),text:nv.value.trim(),done:false})}t.subs=subDraft.map(x=>({...x}));t.tipo=$('#eTipo').value;t.due=$('#eDue').value||'';t.nivel=$('#sheet').dataset.lvl||'n';
    if(t.due&&t.due>=today()&&t.missed&&t.missedFrom!==t.due)t.missed=false;
    save();closeSheet();render()},
  eDel:el=>{if(!confirm('¿Borrar esta tarea?'))return;state.tasks=state.tasks.filter(x=>x.id!==el.dataset.id);save();closeSheet();render()},
  gp:el=>{gPer=el.dataset.p;render()},
  gnav:el=>{const n=+el.dataset.n;if(gPer==='dia')gRef=addDays(gRef,n);else if(gPer==='sem')gRef=addDays(gRef,7*n);else{const d=parse(gRef);gRef=ymd(new Date(d.getFullYear(),d.getMonth()+n,1))}render()},
  gAdd:()=>{const v=num($('#gAmt').value);if(!v){toast('Poné el monto');return}
    state.expenses.push({id:uid(),date:$('#gDate').value||today(),amount:v,cat:$('#gCat').value,detail:$('#gDet').value.trim(),ts:String(Date.now())});save();render();toast('Gasto anotado: '+money(v))},
  gDel:el=>{if(!confirm('¿Borrar este gasto?'))return;state.expenses=state.expenses.filter(e=>e.id!==el.dataset.id);save();render()},
  gset:()=>openGSettings(),
  gsAdd:()=>{readSettings();state.ecats.push({id:uid(),name:'Nueva',emoji:'🏷️',budget:0});(curSheet||openGSettings)()},
  gsDel:el=>{if(state.ecats.length<=1)return;readSettings();state.ecats=state.ecats.filter(c=>c.id!==el.dataset.id);(curSheet||openGSettings)()},
  gsSave:()=>{readG();save();closeSheet();render();toast('Presupuestos guardados')},
  mAdd:()=>{const v=$('#mTxt').value.trim();if(!v){toast('Escribí la meta');return}state.goals.push({id:uid(),text:v,area:$('#mArea').value,horizon:$('#mHor').value,progress:0,focus:!state.goals.some(g=>g.focus)&&$('#mHor').value==='mes'});save();render()},
  mFocus:el=>{state.goals.forEach(g=>g.focus=g.id===el.dataset.id?!g.focus:false);save();render()},
  mDel:el=>{if(!confirm('¿Borrar esta meta?'))return;state.goals=state.goals.filter(g=>g.id!==el.dataset.id);save();render()},
  settings:()=>openSettings(),
  sAddBlock:()=>{readSettings();state.blocks.push({id:uid(),name:'Nuevo bloque',emoji:'🧩',color:'#9AA7C7'});openSettings()},
  sDelBlock:el=>{if(state.blocks.length<=1)return;readSettings();if(!confirm('¿Borrar el bloque? Sus tareas quedan sin bloque.'))return;state.blocks=state.blocks.filter(b=>b.id!==el.dataset.id);openSettings()},
  sAddFix:()=>{readSettings();state.fixed.push({id:uid(),blockId:state.blocks[0].id,title:'',days:[1,2,3,4,5],start:DAY_START,dur:60});openSettings()},
  sDelFix:el=>{readSettings();state.fixed=state.fixed.filter(f=>f.id!==el.dataset.id);openSettings()},
  sDay:el=>{readSettings();const f=state.fixed.find(x=>x.id===el.dataset.id);const d=+el.dataset.d;f.days=f.days.includes(d)?f.days.filter(x=>x!==d):[...f.days,d].sort();openSettings()},
  sNotif:()=>{if(!('Notification' in window)){toast('Este navegador no permite avisos');return}Notification.requestPermission().then(p=>{toast(p==='granted'?'Avisos activados':'Permiso rechazado');readSettings();openSettings()})},
  sSave:()=>{readSettings();
    state.boxes.forEach(b=>{if(!b.fixedId||b.date<today())return;const f=state.fixed.find(x=>x.id===b.fixedId);if(!f)return;if(b.date===today()&&nowMin()>=b.start)return;
      Object.assign(b,{start:f.start,dur:f.dur,blockId:f.blockId,title:f.title||'',aviso:avisoOf(f)>=0,avisoMin:avisoOf(f)})});
    save();closeSheet();render();toast('Ajustes guardados')},
  sExport:()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,1)],{type:'application/json'}));a.download='javitime-copia-'+today()+'.json';document.body.appendChild(a);a.click();setTimeout(()=>a.remove(),300)},
  alarmOff:()=>{$('#alarm').classList.remove('open');if(navigator.vibrate)navigator.vibrate(0)},
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const f=A[el.dataset.act];if(f){e.preventDefault();f(el,e)}});
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.id==='nSearch'){nQ=el.value;const pos=el.selectionStart;render();const n=$('#nSearch');if(n){n.focus();n.setSelectionRange(pos,pos)}return}
  if(draft&&el.dataset.f==='title')draft.b.title=el.value;
  if(el.dataset.goal){const g=state.goals.find(x=>x.id===el.dataset.goal);if(g){g.progress=+el.value;el.nextElementSibling.textContent=el.value+'%'}}
});
document.addEventListener('change',e=>{
  const el=e.target;
  if((el.id==='bBlk'||el.id==='eBlk')&&el.value==='__new'){
    const n=(prompt('Nombre del bloque nuevo')||'').trim();
    if(n){const b={id:uid(),name:n,emoji:'🧩',color:pickColor(state.blocks.length)};state.blocks.push(b);save();el.innerHTML=blockOpts(b.id);if(el.id==='bBlk')bForm.b=b.id;toast('Bloque creado. Cambiale emoji y color en Configuración.')}
    else el.value=el.id==='bBlk'?bForm.b:'';
  }else if(el.id==='bBlk')bForm.b=el.value;
  if(el.id==='bLvl')bForm.l=el.value;
  if(el.id==='bTipo')bForm.t=el.value;
  if((el.id==='qCat'||el.id==='gCat')&&el.value==='__new'){
    const n=(prompt('Nombre de la categoría nueva')||'').trim();
    if(n){const c={id:uid(),name:n,emoji:'🏷️',budget:0};state.ecats.push(c);save();el.innerHTML=catOpts(c.id)}
    else el.value=state.ecats[0].id;
  }
  if(draft&&el.dataset.f==='start'){draft.b.start=+el.value;renderBoxSheet()}
  if(el.dataset.goal){save();render()}
  if(el.id==='sImport'&&el.files[0]){const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!confirm('¿Reemplazar todo con esta copia?'))return;state=normalize(d);save();closeSheet();afterLoad();render();toast('Copia restaurada')}catch(x){toast('El archivo no es una copia válida')}};r.readAsText(el.files[0])}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){closeSheet();return}
  if(e.key!=='Enter')return;const id=e.target.id;
  if(e.target.classList.contains('fiNew')){e.preventDefault();A.fiAdd(e.target);return}
  const map={eSubNew:'sdAdd',fdNew:'fdAdd',dNew:'dAdd',bTxt:'addBanco',qDet:'qExp',qAmt:'qExp',gDet:'gAdd',mTxt:'mAdd',pNew:'setPnew'};
  if(map[id]){e.preventDefault();const btn=document.querySelector(`[data-act="${map[id]}"]`);if(btn)A[map[id]](btn)}
});
document.addEventListener('visibilitychange',()=>{if(!document.hidden){tick();push();if(pomo&&pomo.running){if(Date.now()>=pomo.endAt)pomoNext(true);else requestWake()}}});
window.addEventListener('online',()=>push());
window.addEventListener('popstate',()=>{
  if(ignorePop){ignorePop=false;return}
  if($('#alarm').classList.contains('open')){$('#alarm').classList.remove('open');return}
  if($('#sheet').classList.contains('open')){closeSheet(true);return}
  if($('#pomo').classList.contains('open')){$('#pomo').classList.remove('open');pomoPill();return}
  if(tab!=='hoy'){tab='hoy';window.scrollTo(0,0);render();return}
});

/* ---------- arranque ---------- */
state=normalize(localLoad());
afterLoad();
render();
initFB();
setInterval(tick,20000);
if(pomo){if(pomo.running&&Date.now()>=pomo.endAt)setTimeout(()=>pomoNext(true),500);pomoPill()}
</script>
</body>
</html>
